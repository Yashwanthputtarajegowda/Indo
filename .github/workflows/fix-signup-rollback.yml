name: One-time signup audit fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply signup audit fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply signup rollback fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/features/auth/signup-form.js')
          text = path.read_text()
          old = '''  } catch (error) {\n    await credential.user.delete().catch(() => {});\n    throw error;\n  }'''
          new = '''  } catch (error) {\n    try {\n      const cleanupToken = await credential.user.getIdToken();\n      await fetch(`${apiBase}/api/account/delete`, {\n        method: 'POST',\n        headers: { Authorization: `Bearer ${cleanupToken}` }\n      });\n    } catch {}\n    await credential.user.delete().catch(() => {});\n    throw error;\n  }'''
          if old not in text:
              raise SystemExit('Signup rollback pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-signup-rollback.yml

      - name: Commit signup fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/auth/signup-form.js .github/workflows/fix-signup-rollback.yml
          git commit -m "chore: apply signup audit fix" || exit 0
          git push
