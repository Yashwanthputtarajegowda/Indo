name: Bootstrap Main Repo Lockfile

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - ".github/workflows/bootstrap-lockfile.yml"

permissions:
  contents: write

jobs:
  bootstrap-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile to main
        run: |
          set -euo pipefail
          test -s package-lock.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git add package-lock.json
            if git diff --cached --quiet -- package-lock.json; then
              echo "package-lock.json already exists and is current."
              exit 0
            fi
          else
            git add package-lock.json
          fi

          git commit -m "chore: add main repo npm lockfile"
          git push origin HEAD:main
