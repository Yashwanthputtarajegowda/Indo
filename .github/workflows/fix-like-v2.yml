name: Retry home like fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply fix once
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_HEAD_COMMIT_MESSAGE}" == "chore: apply home like fix v2" ]]; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/app/click-handlers.js')
          text = path.read_text()
          pattern = re.compile(r"      if \(action === 'like'\) \{.*?      \} else if \(action === 'save'\) \{", re.S)
          replacement = '''      if (action === 'like') {\n        if (target.dataset.busy === 'true') return true;\n        target.dataset.busy = 'true';\n        const small = target.querySelector('small');\n        const previousLiked = target.classList.contains('active');\n        const previousCount = Number((small?.textContent || '0').replace(/,/g, '')) || 0;\n        const optimisticLiked = !previousLiked;\n        target.classList.toggle('active', optimisticLiked);\n        if (small) {\n          small.textContent = Math.max(0, previousCount + (optimisticLiked ? 1 : -1)).toLocaleString();\n        }\n        try {\n          const current = await loadEngagement(mediaId);\n          const result = await toggleLike(mediaId, !current.liked);\n          target.classList.toggle('active', Boolean(result.liked));\n          if (small) small.textContent = Number(result.likes || 0).toLocaleString();\n          target.title = result.liked ? 'Liked' : 'Like';\n        } catch (error) {\n          target.classList.toggle('active', previousLiked);\n          if (small) small.textContent = previousCount.toLocaleString();\n          target.title = error.message || 'Could not update like.';\n        } finally {\n          delete target.dataset.busy;\n        }\n      } else if (action === 'save') {'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Like block not found')
          path.write_text(updated)
          PY
          rm -f .github/workflows/fix-home-like.yml .github/workflows/fix-like-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/click-handlers.js .github/workflows/fix-home-like.yml .github/workflows/fix-like-v2.yml
          git commit -m "chore: apply home like fix v2"
          git push
