name: Firebase Rules Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - "database.rules.json"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-rules.yml"

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Validate Firebase rules files
        run: node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8')); JSON.parse(require('fs').readFileSync('firebase.json','utf8')); console.log('Firebase config files are valid JSON.')"

      - name: Verify deployment secret
        run: test -n "$FIREBASE_TOKEN"

      - name: Deploy Realtime Database rules
        run: firebase deploy --only database --project indo-174f0 --token "$FIREBASE_TOKEN"
