name: Production Config Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/runtime-config.js"
      - "index.html"
      - ".github/workflows/production-config-check.yml"

audit:
  runs-on: ubuntu-latest
  permissions:
    contents: read

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check runtime API configuration
      shell: bash
      run: |
        set -euo pipefail
        grep -q 'INDO_API_BASE_URL' config/runtime-config.js
        grep -q 'runtime-config.js' index.html
        echo "Frontend runtime API configuration is wired."

    - name: Check required deployment files
      shell: bash
      run: |
        set -euo pipefail
        test -f firebase.json
        test -f .firebaserc
        test -f database.rules.json
        echo "Firebase deployment files are present."

    - name: Optional backend health smoke test
      if: ${{ vars.BACKEND_HEALTH_URL != '' }}
      shell: bash
      env:
        BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --max-time 15 "$BACKEND_HEALTH_URL/api/health" > health.json
        grep -q '"ok":true' health.json
        echo "Backend health check passed."
