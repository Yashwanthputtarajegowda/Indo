name: Fix home video sound autoplay

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[video-ui-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply home video UI patch
        run: |
          if [ ! -f scripts/indo-video-patch.py ]; then
            echo 'Patch script not present; nothing to do.'
            exit 0
          fi

          python scripts/indo-video-patch.py
          git rm scripts/indo-video-patch.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/feed/home-feed.js .github/workflows/fix-home-video-sound.yml

          if git diff --cached --quiet; then
            echo 'No UI changes were needed.'
            exit 0
          fi

          git commit -m 'feat: refresh futuristic home video section [video-ui-patched]'
          git push
