name: Release Readiness

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify required frontend files
        run: |
          test -f index.html
          test -f config/runtime-config.js
          test -f firebase.json
          test -f database.rules.json
          test -f .firebaserc

      - name: Validate JSON config
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8')); JSON.parse(require('fs').readFileSync('database.rules.json','utf8')); JSON.parse(require('fs').readFileSync('.firebaserc','utf8'))"

      - name: Syntax-check frontend JavaScript
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Optional production health check
        if: ${{ vars.BACKEND_HEALTH_URL != '' }}
        run: |
          curl --fail --silent --show-error --max-time 15 "$BACKEND_HEALTH_URL"
