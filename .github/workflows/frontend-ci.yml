name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0)
          test "$found" -eq 1

      - name: Validate required frontend files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f config/runtime-config.js
          test -f .firebaserc
          test -f firebase.json
