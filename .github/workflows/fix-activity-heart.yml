name: Fix activity heart

on:
  push:
    branches: [main]

jobs:
  patch:
    if: "contains(github.event.head_commit.message, 'chore: wire activity heart')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch home activity button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/screens/home.js')
          text = path.read_text()
          old = '<button aria-label="Activity">${icons.heart}</button>'
          new = '<button data-screen="notifications" aria-label="Activity">${icons.heart}</button>'
          if old not in text:
              raise SystemExit('Activity heart button pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-activity-heart.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/home.js .github/workflows/fix-activity-heart.yml
          git commit -m "chore: wire activity heart"
          git push
