<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indo • Following</title>
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>
    <main id="app">
        <section class="indo-page following-page">
            <header class="page-header">
                <div class="page-brand">Indo</div>
                <button class="page-action" type="button" data-page="profile">◎</button>
            </header>

            <main class="page-content">
                <span class="page-kicker">YOUR FEED</span>
                <h1>Following</h1>
                <p class="page-subtitle">Creators you choose to follow will appear here.</p>

                <section class="following-empty">
                    <div class="following-icon">♡</div>
                    <h2>Your feed is empty</h2>
                    <p>Discover creators in Indo Clips and follow the ones you like.</p>
                    <button class="primary-page-button" type="button" data-page="clips">
                        Discover creators
                    </button>
                </section>
            </main>

            <nav class="bottom-nav">
                <button class="nav-item" data-page="home">
                    <span>⌂</span>
                    <small>Home</small>
                </button>
                <button class="nav-item" data-page="clips">
                    <span>◉</span>
                    <small>Clips</small>
                </button>
                <button class="nav-create" data-page="create">
                    <span>＋</span>
                </button>
                <button class="nav-item active" data-page="following">
                    <span>♡</span>
                    <small>Following</small>
                </button>
                <button class="nav-item" data-page="profile">
                    <span>◎</span>
                    <small>Profile</small>
                </button>
            </nav>
        </section>
    </main>

    <script src="../js/page-links.js"></script>
    <script src="../js/following.js"></script>
</body>
</html>
