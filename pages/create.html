<section class="indo-page create-page">
    <header class="page-header">
        <button class="page-action" type="button" data-page="home">×</button>
        <div class="page-brand">Indo</div>
        <span class="page-spacer"></span>
    </header>
    <main class="page-content">
        <span class="page-kicker">CREATE</span>
        <h1>Make something.</h1>
        <p class="page-subtitle">Share a video, clip or moment with Indo.</p>
        <form id="create-form" class="create-form">
            <label class="upload-zone" for="video-file"><span class="upload-icon">＋</span><strong>Choose a video</strong><small>MP4, WebM or MOV</small></label>
            <input id="video-file" name="video" type="file" accept="video/mp4,video/webm,video/quicktime" hidden>
            <label class="field-label" for="video-title">Title</label>
            <input id="video-title" name="title" class="text-field" type="text" maxlength="100" placeholder="Give your video a title">
            <button class="primary-page-button" type="submit">Continue</button>
        </form>
        <p id="create-status" class="form-status" role="status"></p>
    </main>
</section>
<script src="../js/page-links.js"></script>
