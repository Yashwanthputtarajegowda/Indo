<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>Indo Reels</title>
    <link
        rel="stylesheet"
        href="../css/pages/reels.css"
    >
</head>
<body>
    <main class="reels-page">
        <header class="reels-header">
            <h1>Reels</h1>
        </header>

        <section
            id="reelFeed"
            class="reel-feed"
            aria-label="Reels feed"
        >
        </section>

        <nav
            class="reels-bottom-nav"
            aria-label="Main navigation"
        >
            <button
                class="reels-nav-button"
                data-page="home"
                type="button"
            >
                <span class="reels-nav-icon">⌂</span>
                <span>Home</span>
            </button>

            <button
                class="reels-nav-button"
                data-page="messages"
                type="button"
            >
                <span class="reels-nav-icon">✉</span>
                <span>Messages</span>
            </button>

            <button
                class="reels-nav-button active"
                data-page="reels"
                type="button"
                aria-current="page"
            >
                <span class="reels-nav-icon">▶</span>
                <span>Reels</span>
            </button>

            <button
                class="reels-nav-button"
                data-page="profile"
                type="button"
            >
                <span class="reels-nav-icon">◎</span>
                <span>Profile</span>
            </button>
        </nav>
    </main>

    <script
        type="module"
        src="../js/pages/reels.js"
    ></script>
</body>
</html>
