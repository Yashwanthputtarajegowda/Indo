<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>Indo Profile</title>
    <link
        rel="stylesheet"
        href="../css/pages/profile.css"
    >
</head>
<body>
    <main class="profile-page">
        <header class="page-header">
            <h1>Profile</h1>
        </header>

        <section id="profile">
        </section>

        <nav
            class="bottom-nav"
            aria-label="Main navigation"
        >
            <button
                class="nav-button"
                data-page="home"
                type="button"
            >
                <span class="nav-icon">⌂</span>
                <span>Home</span>
            </button>

            <button
                class="nav-button"
                data-page="messages"
                type="button"
            >
                <span class="nav-icon">✉</span>
                <span>Messages</span>
            </button>

            <button
                class="nav-button"
                data-page="reels"
                type="button"
            >
                <span class="nav-icon">▶</span>
                <span>Reels</span>
            </button>

            <button
                class="nav-button active"
                data-page="profile"
                type="button"
                aria-current="page"
            >
                <span class="nav-icon">◎</span>
                <span>Profile</span>
            </button>
        </nav>
    </main>

    <script
        type="module"
        src="../js/pages/profile.js"
    ></script>
</body>
</html>
