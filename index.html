<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08080d" />
  <meta name="application-name" content="Indo" />
  <meta name="apple-mobile-web-app-title" content="Indo" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./src/styles.css?v=20260813-59" />
  <link rel="stylesheet" href="./src/auth.css?v=20260813-59" />
  <link rel="stylesheet" href="./src/features/splash/splash.css?v=20260813-59" />
  <style>
    .story-file-name{display:none!important}
    #story-preview .story-done-positioned{position:absolute!important;left:auto!important;right:0!important;bottom:12px!important;width:20%!important;max-width:none!important;height:46px!important;z-index:21!important;margin:0!important}
    #story-preview .story-add-positioned{position:absolute!important;right:14px!important;bottom:68px!important;z-index:22!important}
    #story-preview video,#story-preview .story-element{transform-origin:center center!important;touch-action:none!important}
    #story-preview #indo-story-share-button{display:grid!important;place-items:center!important;position:absolute!important;left:auto!important;right:calc(20% + 8px)!important;bottom:12px!important;width:38px!important;height:44px!important;z-index:999!important;margin:0!important;padding:0!important;border:0!important;border-radius:10px!important;background:#20202a!important;color:#fff!important;font-size:20px!important;font-weight:900!important;cursor:pointer!important;visibility:visible!important;opacity:1!important}
  </style>
  <title>Indo</title>
</head>
<body>
  <div id="root">
    <main class="splash-screen" aria-busy="true" aria-label="Loading Indo">
      <div class="splash-logo">I</div>
      <div class="splash-name">Indo</div>
      <div class="splash-spinner" aria-hidden="true"></div>
    </main>
  </div>
  <script src="./config/runtime-config.js?v=20260813-59"></script>
  <script>
    window.__indoFixStoryEditor = function fixStoryEditorLayout() {
      const preview = document.getElementById('story-preview');
      const publish = document.getElementById('story-publish-button');
      const addButton = document.getElementById('story-add-button');
      if (!preview || !publish || !addButton) return false;
      if (publish.parentElement !== preview) preview.appendChild(publish);
      publish.textContent = 'Done';
      publish.classList.add('story-done-positioned');
      addButton.classList.add('story-add-positioned');
      const panel = document.getElementById('story-add-panel');
      if (panel) panel.style.bottom = '124px';
      const oldSelect = document.getElementById('story-create-select');
      if (oldSelect) oldSelect.style.display = 'none';
      ensureStoryShareButton(preview, publish);
      bindStoryPinchGestures(preview);
      return true;
    };

    function ensureStoryShareButton(preview, done) {
      let button = document.getElementById('indo-story-share-button');
      if (!button) {
        button = document.createElement('button');
        button.id = 'indo-story-share-button';
        button.type = 'button';
        button.textContent = '↗';
        button.setAttribute('aria-label', 'Share story');
        preview.appendChild(button);
        button.addEventListener('click', async (event) => {
          event.preventDefault();
          event.stopImmediatePropagation();
          try {
            let story = null;
            try { story = JSON.parse(localStorage.getItem('indo:last-story') || 'null'); } catch {}
            if (!story?.id && !story?.publicId) {
              done.click();
              button.disabled = true;
              button.textContent = '…';
              await new Promise((resolve) => setTimeout(resolve, 1200));
              try { story = JSON.parse(localStorage.getItem('indo:last-story') || 'null'); } catch {}
              button.disabled = false;
              button.textContent = '↗';
            }
            const id = String(story?.id || story?.publicId || '').trim();
            if (!id) throw new Error('Story is not published yet.');
            const url = `${window.location.origin}${window.location.pathname}?story=${encodeURIComponent(id)}`;
            const title = String(story?.title || 'Indo story').trim() || 'Indo story';
            if (navigator.share) {
              await navigator.share({title, text:'Watch this story on Indo', url});
            } else if (navigator.clipboard?.writeText) {
              await navigator.clipboard.writeText(url);
              window.alert(`Story link copied:\n${url}`);
            } else {
              window.prompt('Copy this story link:', url);
            }
          } catch (error) {
            button.disabled = false;
            button.textContent = '↗';
            console.warn('Story sharing failed:', error);
          }
        });
      }
      button.style.cssText = 'display:grid!important;place-items:center!important;position:absolute!important;left:auto!important;right:calc(20% + 8px)!important;bottom:12px!important;width:38px!important;height:44px!important;z-index:999!important;margin:0!important;padding:0!important;border:0!important;border-radius:10px!important;background:#20202a!important;color:#fff!important;font-size:20px!important;font-weight:900!important;cursor:pointer!important;visibility:visible!important;opacity:1!important;';
      if (button.parentElement !== preview) preview.appendChild(button);
    }

    function bindStoryPinchGestures(preview) {
      if (!preview || preview.dataset.pinchBound === '1') return;
      preview.dataset.pinchBound = '1';
      const pointers = new Map();
      const states = new WeakMap();
      let gesture = null;
      let suppressClick = false;

      const getTarget = (event) => {
        const element = event.target instanceof Element ? event.target : null;
        if (!element) return null;
        if (element.matches('#story-preview-video')) return element;
        return element.closest('.story-photo-element, .story-emoji-element, .story-title-element');
      };

      const getState = (target) => {
        if (!states.has(target)) states.set(target, { scale: 1, rotation: 0 });
        return states.get(target);
      };

      const applyState = (target, state) => {
        if (target.matches('#story-preview-video')) target.style.transform = `scale(${state.scale}) rotate(${state.rotation}deg)`;
        else target.style.transform = `translate(-50%,-50%) scale(${state.scale}) rotate(${state.rotation}deg)`;
        target.dataset.gestureScale = String(state.scale);
        target.dataset.gestureRotation = String(state.rotation);
      };

      const distance = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
      const angle = (a, b) => Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;

      preview.addEventListener('pointerdown', (event) => {
        const target = getTarget(event);
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY, target });
        if (pointers.size !== 2) return;
        const entries = [...pointers.values()];
        const first = entries[0];
        const second = entries[1];
        const gestureTarget = first.target || second.target;
        if (!gestureTarget) return;
        const state = getState(gestureTarget);
        gesture = { target:gestureTarget, startDistance:Math.max(1,distance(first,second)), startAngle:angle(first,second), startScale:state.scale, startRotation:state.rotation };
        suppressClick = true;
        event.preventDefault();
        event.stopImmediatePropagation();
      }, true);

      preview.addEventListener('pointermove', (event) => {
        if (!pointers.has(event.pointerId)) return;
        pointers.set(event.pointerId, { ...pointers.get(event.pointerId), x:event.clientX, y:event.clientY });
        if (!gesture || pointers.size < 2) return;
        const entries = [...pointers.values()];
        const first = entries[0], second = entries[1];
        const state = getState(gesture.target);
        state.scale = Math.max(0.5, Math.min(4, gesture.startScale * (distance(first,second) / gesture.startDistance)));
        state.rotation = gesture.startRotation + (angle(first,second) - gesture.startAngle);
        applyState(gesture.target,state);
        event.preventDefault();
        event.stopImmediatePropagation();
      }, true);

      const endPointer = (event) => {
        pointers.delete(event.pointerId);
        if (gesture && pointers.size < 2) gesture = null;
      };
      preview.addEventListener('pointerup', endPointer, true);
      preview.addEventListener('pointercancel', endPointer, true);
      preview.addEventListener('click', (event) => {
        if (!suppressClick) return;
        suppressClick = false;
        event.preventDefault();
        event.stopImmediatePropagation();
      }, true);
    }

    (function startStoryEditorFixPoll() {
      let attempts = 0;
      const timer = setInterval(() => {
        attempts += 1;
        if (window.__indoFixStoryEditor?.()) { clearInterval(timer); return; }
        if (attempts >= 80) clearInterval(timer);
      }, 100);
    })();

    (function bindStoryVideoInteractionFix() {
      let swallowNextStoryVideoClick = false;
      document.addEventListener('pointerdown', (event) => {
        const target = event.target instanceof Element ? event.target : null;
        const preview = target?.closest('#story-preview');
        if (!preview) return;
        const panel = preview.querySelector('#story-add-panel');
        const video = preview.querySelector('#story-preview-video');
        if (!panel || !video) return;
        if (!panel.hidden && target === video) {
          panel.hidden = true;
          preview.querySelector('#story-emoji-picker')?.setAttribute('hidden', '');
          video.muted = false;
          video.volume = 1;
          video.play().catch(() => {});
          swallowNextStoryVideoClick = true;
          event.preventDefault();
          event.stopImmediatePropagation();
          return;
        }
        if (target === video) {
          video.muted = false;
          video.volume = 1;
          video.play().catch(() => {});
        }
      }, true);
      document.addEventListener('click', (event) => {
        if (!swallowNextStoryVideoClick) return;
        const target = event.target instanceof Element ? event.target : null;
        if (!target?.closest('#story-preview-video')) return;
        swallowNextStoryVideoClick = false;
        event.preventDefault();
        event.stopImmediatePropagation();
      }, true);
    })();

    window.addEventListener('error', (event) => {
      const message = String(event.error?.message || event.message || 'Application failed to load.');
      const source = event.filename ? ` ${event.filename}${event.lineno ? `:${event.lineno}` : ''}${event.colno ? `:${event.colno}` : ''}` : '';
      const root = document.getElementById('root');
      if (!root || !root.querySelector('.splash-screen')) return;
      const safe = `${message}${source}`.replace(/[&<>\\"']/g, '');
      root.innerHTML = `<main class="splash-screen splash-error"><div class="splash-logo">I</div><div class="splash-name">Indo</div><p>Indo could not start.</p><small>${safe}</small><button type="button" onclick="location.reload()">Reload</button></main>`;
    });
    window.addEventListener('unhandledrejection', (event) => {
      window.dispatchEvent(new ErrorEvent('error', { error: event.reason, message: String(event.reason?.message || event.reason || 'Startup failed.') }));
    });

    document.addEventListener('click', async (event) => {
      const button = event.target instanceof Element ? event.target.closest('.story-delete') : null;
      if (!button) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      button.disabled = true;
      button.textContent = 'Deleting...';
      try {
        const [{ auth }, { getApp }, { getDatabase, ref, get, remove }] = await Promise.all([
          import('./src/features/auth/firebase-client.js?v=20260813-59'),
          import('https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js'),
          import('https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js')
        ]);
        const user = auth.currentUser;
        if (!user) throw new Error('Please login first.');
        const video = button.closest('.story-viewer-v2-card')?.querySelector('video');
        const storyUrl = String(video?.currentSrc || video?.src || '').trim();
        if (!storyUrl) throw new Error('Story video could not be identified.');
        const db = getDatabase(getApp());
        const snapshot = await get(ref(db, 'stories'));
        const stories = snapshot.val() || {};
        let matchId = '';
        for (const [id, story] of Object.entries(stories)) {
          if (!story || String(story.ownerUid || '') !== String(user.uid || '')) continue;
          const url = String(story.secureUrl || story.videoUrl || story.url || story.mediaUrl || '').trim();
          if (url === storyUrl) { matchId = id; break; }
        }
        if (!matchId) throw new Error('Story could not be found.');
        await remove(ref(db, `stories/${matchId}`));
        localStorage.removeItem('indo:last-story');
        document.querySelector('.story-viewer-v2')?.remove();
        window.location.reload();
      } catch (error) {
        button.disabled = false;
        button.textContent = error?.message || 'Could not delete story.';
      }
    }, true);
  </script>
  <script type="module" src="./src/main.js?v=20260813-59"></script>
</body>
</html>
