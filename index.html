<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08080d" />
  <meta name="application-name" content="Indo" />
  <meta name="apple-mobile-web-app-title" content="Indo" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./src/styles.css?v=20260813-32" />
  <link rel="stylesheet" href="./src/auth.css?v=20260813-32" />
  <link rel="stylesheet" href="./src/features/splash/splash.css?v=20260813-32" />
  <title>Indo</title>
</head>
<body>
  <div id="root">
    <main class="splash-screen" aria-busy="true" aria-label="Loading Indo">
      <div class="splash-logo">I</div>
      <div class="splash-name">Indo</div>
      <div class="splash-spinner" aria-hidden="true"></div>
    </main>
  </div>
  <script src="./config/runtime-config.js?v=20260813-32"></script>
  <script>
    window.addEventListener('error', (event) => {
      const message = String(event.error?.message || event.message || 'Application failed to load.');
      const source = event.filename ? ` ${event.filename}${event.lineno ? `:${event.lineno}` : ''}${event.colno ? `:${event.colno}` : ''}` : '';
      const root = document.getElementById('root');
      if (!root || !root.querySelector('.splash-screen')) return;
      const safe = `${message}${source}`.replace(/[&<>\"']/g, '');
      root.innerHTML = `<main class="splash-screen splash-error"><div class="splash-logo">I</div><div class="splash-name">Indo</div><p>Indo could not start.</p><small>${safe}</small><button type="button" onclick="location.reload()">Reload</button></main>`;
    });
    window.addEventListener('unhandledrejection', (event) => {
      window.dispatchEvent(new ErrorEvent('error', { error: event.reason, message: String(event.reason?.message || event.reason || 'Startup failed.') }));
    });
  </script>
  <script type="module" src="./src/main.js?v=20260813-32"></script>
</body>
</html>
