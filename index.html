<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0014" />
  <meta name="description" content="Indo - Watch. Connect. Share." />
  <title>Indo</title>
  <script src="./config/runtime-config.js"></script>
  <style>
    #boot-error {
      display: none;
      max-width: 720px;
      margin: 48px auto;
      padding: 24px;
      font-family: system-ui, sans-serif;
      color: #1f1f1f;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 14px;
      box-sizing: border-box;
    }
    #boot-error strong { display: block; margin-bottom: 8px; }
    #boot-error pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="boot-error" role="alert">
    <strong>Indo could not start.</strong>
    <pre data-boot-error>Please refresh the page. If the problem continues, send this message to support.</pre>
  </div>
  <script>
    window.addEventListener("error", (event) => {
      const box = document.getElementById("boot-error");
      const text = box?.querySelector("[data-boot-error]");
      if (!box || !text) return;
      box.style.display = "block";
      text.textContent = event?.error?.message || event?.message || "A JavaScript error prevented the app from starting.";
    });
    window.addEventListener("unhandledrejection", (event) => {
      const box = document.getElementById("boot-error");
      const text = box?.querySelector("[data-boot-error]");
      if (!box || !text) return;
      box.style.display = "block";
      text.textContent = event?.reason?.message || String(event?.reason || "An unexpected error prevented the app from starting.");
    });
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
