<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090612">
    <title>Indo</title>
    <link rel="stylesheet" href="./css/app.css">
</head>
<body>
    <main id="app">
        <section class="auth-screen">
            <div class="auth-card">
                <div class="brand-mark" aria-hidden="true">
                    <span class="brand-play">▶</span>
                </div>

                <h1>Indo</h1>
                <p class="tagline">Watch <span>•</span> Create <span>•</span> Share</p>
                <p class="welcome">Your world. Your videos.</p>

                <form id="login-form" class="login-form">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="Enter your email" autocomplete="email" required>

                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>

                    <button class="primary-btn" type="submit">Sign In</button>
                </form>

                <button id="create-account" class="secondary-btn" type="button">Create Account</button>

                <div class="divider"><span>or continue with</span></div>

                <div class="social-row">
                    <button type="button" class="social-btn" aria-label="Continue with Google">G</button>
                    <button type="button" class="social-btn" aria-label="Continue with Facebook">f</button>
                    <button type="button" class="social-btn" aria-label="Continue with phone">⌕</button>
                </div>

                <p id="auth-message" class="auth-message" role="status"></p>
            </div>
        </section>
    </main>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
