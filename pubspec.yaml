name: indo
description: Indo - a modern social media app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.10
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  intl: ^0.19.0

flutter:
  uses-material-design: true
  assets:
    - assets/
